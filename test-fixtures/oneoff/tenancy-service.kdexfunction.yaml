apiVersion: kdex.dev/v1alpha1
kind: KDexFunction
metadata:
  name: tenancy-service
  namespace: dev
  labels:
    kdex.dev/host: rsi-dev
spec:
  hostRef:
    name: rsi-dev
  serviceAccountName: user-service-sa
  tolerations:
    - key: cloud.google.com/gke-spot
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: component
      operator: Equal
      value: workload-amd64
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/arch: amd64
    component: workload-amd64
  origin:
    source:
      repository: https://gitlab.com/recoursellm-group/knowdrive-site
      revision: main
      path: functions/tenancy-service
      regenerate: false
      builder:
        name: tiny
        builderRef:
          kind: ClusterBuilder
          name: tiny-builder
        languages:
          - go
          - rust
        serviceAccountName: kdex-builder
        resources:
          requests:
            memory: 2Gi
          limits:
            memory: 4Gi
  api:
    basePath: /tenant/v1
    paths:
      /tenant/v1/stores:
        get:
          operationId: listMyStores
          summary: List vector stores the caller owns or is a member of
          tags:
            - tenant
          security:
            - bearer:
                - functions:/tenant/v1:read
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Store'
            "401":
              description: Unauthorized
      /tenant/v1/stores/{id}:
        patch:
          operationId: renameStore
          summary: Rename a store's display name (caller must be the store owner)
          tags:
            - tenant
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - display_name
                  properties:
                    display_name:
                      type: string
                      minLength: 1
                      maxLength: 256
          security:
            - bearer:
                - functions:/tenant/v1:read
                - functions:/tenant/v1:update
          responses:
            "200":
              description: Renamed
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/RenameResult'
            "400":
              description: Invalid display name
            "403":
              description: Caller is not the store owner
            "404":
              description: Store not found
      /tenant/v1/stores/{id}/members:
        get:
          operationId: listMembers
          summary: List members of a store (caller must be a member)
          tags:
            - tenant
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
          security:
            - bearer:
                - functions:/tenant/v1:read
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
            "403":
              description: Caller is not a member
            "404":
              description: Store not found
        post:
          operationId: addMember
          summary: Add a member by email (caller must have a manage role)
          tags:
            - tenant
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - email
                    - role
                  properties:
                    email:
                      type: string
                      format: email
                    role:
                      type: string
                      enum:
                        - owner
                        - editor
                        - viewer
          security:
            - bearer:
                - functions:/tenant/v1:read
                - functions:/tenant/v1:create
          responses:
            "200":
              description: Existing user added
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/AddResult'
            "201":
              description: Invitation created for a not-yet user
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/AddResult'
            "403":
              description: Caller lacks a manage role on the store
            "404":
              description: Store not found
      /tenant/v1/stores/{id}/members/{userId}:
        patch:
          operationId: updateMemberRole
          summary: Change a member's role (caller must have a manage role; the store owner's role is fixed)
          tags:
            - tenant
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
            - in: path
              name: userId
              required: true
              schema:
                type: string
                format: uuid
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - role
                  properties:
                    role:
                      type: string
                      enum:
                        - owner
                        - editor
                        - viewer
          security:
            - bearer:
                - functions:/tenant/v1:read
                - functions:/tenant/v1:update
          responses:
            "204":
              description: Role updated
            "403":
              description: Caller lacks a manage role, or the target is the store owner
            "404":
              description: Store or member not found
        delete:
          operationId: removeMember
          summary: Remove a member (caller must have a manage role; cannot remove the owner)
          tags:
            - tenant
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
            - in: path
              name: userId
              required: true
              schema:
                type: string
                format: uuid
          security:
            - bearer:
                - functions:/tenant/v1:read
                - functions:/tenant/v1:delete
          responses:
            "204":
              description: Removed
            "403":
              description: Caller lacks a manage role, or target is the owner
            "404":
              description: Store or member not found
      /tenant/v1/stores/{id}/membership:
        delete:
          operationId: leaveStore
          summary: Leave a store (remove the caller's OWN membership; the owner cannot leave)
          tags:
            - tenant
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
          security:
            - bearer:
                - functions:/tenant/v1:read
                - functions:/tenant/v1:delete
          responses:
            "204":
              description: Left the store
            "403":
              description: The store owner cannot leave their own store
            "404":
              description: The caller is not a member of the store
      /tenant/v1/invitations:
        get:
          operationId: listMyInvitations
          summary: List pending store invitations addressed to the caller (by their email)
          tags:
            - tenant
          security:
            - bearer:
                - functions:/tenant/v1:read
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyInvitation'
            "401":
              description: Unauthorized
      /tenant/v1/invitations/{invitationId}:
        post:
          operationId: acceptInvitation
          summary: Accept a store invitation addressed to the caller (opt-in — adds them to the store with the invited role)
          tags:
            - tenant
          parameters:
            - in: path
              name: invitationId
              required: true
              schema:
                type: string
                format: uuid
          security:
            - bearer:
                - functions:/tenant/v1:read
                - functions:/tenant/v1:create
          responses:
            "204":
              description: Accepted — the caller was added to the store
            "404":
              description: No pending invitation for the caller with that id
        delete:
          operationId: declineInvitation
          summary: Decline a store invitation addressed to the caller
          tags:
            - tenant
          parameters:
            - in: path
              name: invitationId
              required: true
              schema:
                type: string
                format: uuid
          security:
            - bearer:
                - functions:/tenant/v1:read
                - functions:/tenant/v1:delete
          responses:
            "204":
              description: Declined
            "404":
              description: No pending invitation for the caller with that id
      /tenant/v1/stores/{id}/invitations:
        get:
          operationId: listInvitations
          summary: List pending invitations for a store (caller must have a manage role)
          tags:
            - tenant
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
          security:
            - bearer:
                - functions:/tenant/v1:read
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
            "403":
              description: Caller lacks a manage role
            "404":
              description: Store not found
      /tenant/v1/stores/{id}/invitations/{invitationId}:
        delete:
          operationId: revokeInvitation
          summary: Revoke a pending invitation (caller must have a manage role)
          tags:
            - tenant
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
            - in: path
              name: invitationId
              required: true
              schema:
                type: string
                format: uuid
          security:
            - bearer:
                - functions:/tenant/v1:read
                - functions:/tenant/v1:delete
          responses:
            "204":
              description: Revoked
            "403":
              description: Caller lacks a manage role
            "404":
              description: Invitation not found
    schemas:
      Store:
        type: object
        required:
          - id
          - role
          - owner
          - quota_bytes
        properties:
          id:
            type: string
          display_name:
            type: string
            nullable: true
          role:
            type: string
          owner:
            type: boolean
          quota_bytes:
            type: integer
            format: int64
      RenameResult:
        type: object
        required:
          - id
          - display_name
        properties:
          id:
            type: string
          display_name:
            type: string
      Member:
        type: object
        required:
          - user_id
          - email
          - role
        properties:
          user_id:
            type: string
            format: uuid
          email:
            type: string
          role:
            type: string
          given_name:
            type: string
            nullable: true
          family_name:
            type: string
            nullable: true
          display_name:
            type: string
            nullable: true
          last_login_at:
            type: string
            format: date-time
            nullable: true
      AddResult:
        type: object
        required:
          - status
        properties:
          status:
            type: string
            enum:
              - added
              - invited
      Invitation:
        type: object
        required:
          - id
          - email
          - role
          - expires_at
        properties:
          id:
            type: string
            format: uuid
          email:
            type: string
          role:
            type: string
          created_at:
            type: string
            format: date-time
            nullable: true
          expires_at:
            type: string
            format: date-time
          invited_by:
            type: string
            nullable: true
      MyInvitation:
        type: object
        required:
          - id
          - store_id
          - role
          - expires_at
        properties:
          id:
            type: string
            format: uuid
          store_id:
            type: string
          store_name:
            type: string
            nullable: true
          role:
            type: string
          invited_by:
            type: string
            nullable: true
          expires_at:
            type: string
            format: date-time
  env:
    - name: CLOUD_SQL_INSTANCE
      value: augeinnovations:northamerica-northeast2:rsi-users-dev
    - name: DB_USER
      value: rsi-userservice-dev@augeinnovations.iam
    - name: DB_NAME
      value: users
    - name: RESEND_API_KEY
      valueFrom:
        secretKeyRef:
          name: knowdrive-resend-credentials
          key: api_key
    - name: RESEND_FROM_ADDRESS
      valueFrom:
        secretKeyRef:
          name: knowdrive-resend-credentials
          key: from_address
    - name: HOST_DOMAIN
      value: dev.knowdrive.ai
    - name: HOST_INTERNAL_URL
      value: http://rsi-dev.dev.svc.cluster.local:8090
    - name: PLAN_VS_QUOTA_BYTES
      value: "1073741824"
    - name: VS_PROVISIONER_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: vs-provisioner
          key: client-id
    - name: VS_PROVISIONER_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: vs-provisioner
          key: client-secret
